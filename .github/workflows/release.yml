name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get plugin metadata
        id: meta
        run: |
          echo "slug=wp-ambientcss" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Verify the tag matches the plugin header and readme
        run: |
          VERSION="${{ steps.meta.outputs.version }}"

          HEADER_VERSION=$(grep -oP '^\s*\*\s*Version:\s*\K[0-9]+\.[0-9]+\.[0-9]+' wp-ambientcss.php)
          if [ "$HEADER_VERSION" != "$VERSION" ]; then
            echo "::error::Tag ${VERSION} does not match the plugin header version (${HEADER_VERSION})"
            exit 1
          fi

          STABLE_TAG=$(grep -oP '^Stable tag:\s*\K[0-9]+\.[0-9]+\.[0-9]+' readme.txt)
          if [ "$STABLE_TAG" != "$VERSION" ]; then
            echo "::error::Tag ${VERSION} does not match readme.txt Stable tag (${STABLE_TAG})"
            exit 1
          fi

          CONST_VERSION=$(grep -oP "define\(\s*'WP_AMBIENTCSS_VERSION',\s*'\K[0-9]+\.[0-9]+\.[0-9]+" wp-ambientcss.php)
          if [ "$CONST_VERSION" != "$VERSION" ]; then
            echo "::error::Tag ${VERSION} does not match WP_AMBIENTCSS_VERSION (${CONST_VERSION})"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build editor assets
        run: npx wp-scripts build

      - name: Create plugin zip
        run: |
          SLUG="${{ steps.meta.outputs.slug }}"
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p dist
          rsync -a --exclude-from=.distignore ./ "dist/${SLUG}/"
          cd dist
          zip -rq "../${SLUG}-${VERSION}.zip" "${SLUG}"

      - name: Verify the zip contents
        run: |
          SLUG="${{ steps.meta.outputs.slug }}"
          VERSION="${{ steps.meta.outputs.version }}"
          ZIP="${SLUG}-${VERSION}.zip"

          unzip -l "$ZIP"

          # Check the archive itself, not the working tree: an over-broad
          # .distignore pattern can silently drop a file that is present in
          # the checkout. assets/vendor/ in particular is easy to lose to a
          # bare "vendor" pattern.
          required=(
            "${SLUG}/${SLUG}.php"
            "${SLUG}/readme.txt"
            "${SLUG}/LICENSE"
            "${SLUG}/uninstall.php"
            "${SLUG}/build/index.js"
            "${SLUG}/build/index.asset.php"
            "${SLUG}/assets/vendor/ambient.css"
            "${SLUG}/assets/vendor/LICENSE-ambientcss.txt"
          )
          for file in "${required[@]}"; do
            if ! unzip -l "$ZIP" | grep -qF " $file"; then
              echo "::error::${file} is missing from ${ZIP}"
              exit 1
            fi
          done

          # Nothing from the development or test side may ship, and the e2e
          # storage state holds a live admin session cookie.
          forbidden=(
            "${SLUG}/artifacts/"
            "${SLUG}/tests/"
            "${SLUG}/node_modules/"
            "${SLUG}/vendor/"
            "${SLUG}/src/"
            "${SLUG}/.github/"
          )
          for path in "${forbidden[@]}"; do
            if unzip -l "$ZIP" | grep -qF " $path"; then
              echo "::error::${path} must not be in ${ZIP}"
              exit 1
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.meta.outputs.slug }}-${{ steps.meta.outputs.version }}.zip
          generate_release_notes: true
