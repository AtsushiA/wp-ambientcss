name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: composer install --no-interaction
      - run: npm ci

      - name: PHP coding standards
        run: composer run lint

      - name: JavaScript coding standards
        run: npm run lint:js

      - name: The committed build is up to date
        run: |
          npx wp-scripts build
          if ! git diff --quiet -- build; then
            echo "::error::build/ is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- build
            exit 1
          fi

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wordpress/plugin-check-action@v1
        with:
          exclude-directories: 'vendor,tests,node_modules,src,bin'
          categories: |
            general
            performance
            accessibility
            security

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install chromium --with-deps

      - name: Start wp-env
        run: npx wp-env start

      - name: Run E2E tests
        run: npx playwright test

      - name: Show WordPress debug log
        if: failure()
        run: cat debug.log || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
